name: DraftKings props + refs

# Hourly from 9 AM to 9 PM Central: DraftKings player prop lines (Points, Rebounds,
# Assists, PRA, Threes) via ESPN's odds feed into Player Minutes, and today's referee
# crews from official.nba.com into Games when they're still blank.
on:
  schedule:
    - cron: "17 15-23 * * *"   # 9:17 AM - 5:17 PM CST
    - cron: "17 0-3 * * *"     # 6:17 PM - 9:17 PM CST
  workflow_dispatch:

concurrency:
  group: dk-props
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Referee crews
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python refs_today.py || echo "refs step failed; props still run"
      - name: DraftKings props
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python dk_props.py
